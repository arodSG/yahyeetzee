<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <title>Yahyeetzee 🎲 Log In</title>
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" type="text/css" href="/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" href="/public/css/override.css" />
    <link rel="stylesheet" type="text/css" href="/public/css/global.css" />
    <!-- <link rel="stylesheet" type="text/css" href="/public/css/resetpassword.css" /> -->
    <link rel="stylesheet" type="text/css" href="https://arodsg.com/css/fonts.css" />
    <script src="https://arodsg.com/js/JQuery/jquery-3.4.1.min.js"></script>
    <script src="https://arodsg.com/js/JQuery/jquery-ui-1.12.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.2.0/socket.io.js"></script>
    <script src="/public/js/global.js" type="module"></script>
    <script src="/public/js/resetpassword.js" type="module"></script>
    <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
</head>
<body class="pt-0 mt-0">
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
        <symbol id="header-dice" viewBox="0 0 16 16">
            <path class="header-dice-background" d="M3 0a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V3a3 3 0 0 0-3-3"/>
            <circle cx="4" cy="4" r="1.5"/>
            <circle cx="12" cy="4" r="1.5"/>
            <circle cx="4" cy="8" r="1.5"/>
            <circle cx="12" cy="8" r="1.5"/>
            <circle cx="4" cy="12" r="1.5"/>
            <circle cx="12" cy="12" r="1.5"/>
        </symbol>
        <symbol id="eye-slash" viewBox="0 0 16 16">
            <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7 7 0 0 0-2.79.588l.77.771A6 6 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755q-.247.248-.517.486z"/>
            <path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829"/>
            <path d="M3.35 5.47q-.27.24-.518.487A13 13 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7 7 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12z"/>
        </symbol>
    </svg>

    <div class="container-lg py-4">
        <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-xxl-6 p-4"></div>

        <div id="header-container" class="row align-items-center mb-xxl-6 mb-4">
            <span class="col"></span>
            <div id="header-title-container" class="col d-flex align-items-center justify-content-center cursor-pointer">
                <svg class="shadow-sm" width="40" height="40"><use href="#header-dice"></use></svg>
                <h1 class="col-8 text-center fw-bold mx-xxl-3 mx-0 my-0">Yahyeetzee</h1>
                <svg class="shadow-sm" width="40" height="40"><use href="#header-dice"></use></svg>
            </div>
            <span class="col"></span>
        </div>

        <div id="main-container" class="content-container justify-content-center">
            <div class="d-flex flex-column align-items-center text-center">
              <h2 id="heading" class="m-0">Reset Password</h2>
            </div>

            <div id="reset-controls" class="mt-xxl-6 mt-4">
                <div class="d-flex flex-column align-items-center">
                    <div class="d-flex flex-column justify-content-center align-items-center">
                        <h4 class="text-center mb-xxl-2 mb-1">New Password</h4>
                        <div aria-label="New Password">
                            <div class="input-group main-input-container rounded-pill shadow">
                                <input id="reset-password-input" class="pass-input main-input form-control text-center" type="password" maxlength="60">
                                <button class="toggle-password show-hide-password-button">
                                    <svg class="eye-slash"><use href="#eye-slash"></use></svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="text-center my-xxl-4 my-3">
                        <p class="info-text mb-0">Password must be at least 8 characters and contain at least 1 letter and 1 number.</p>
                    </div>

                    <div id="reset-password-submit-button-wrapper" data-bs-toggle="tooltip" data-bs-placement="top">
                        <button id="reset-password-submit-button" class="btn btn-lg rounded-pill shadow-lg button-main btn-light d-flex justify-content-center align-items-center" type="button" disabled>
                            <div id="reset-password-submit-button-text">Submit</div>
                            <span id="reset-password-submit-button-spinner" class="spinner-border d-none" role="status" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>
            </div>

            <div id="reset-successful" class="mt-xxl-6 mt-4" style="display: none;">
                <div class="d-flex flex-column align-items-center">
                    <div class="text-center mb-xxl-4 mb-3">
                        <p class="info-text mb-0">Password successfully changed, click the button below to log in.</p>
                    </div>

                    <div>
                        <button id="reset-password-login-button" class="btn rounded-pill shadow-lg button-main-sm btn-light" type="button">Log In</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
